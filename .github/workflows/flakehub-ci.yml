name: FlakeHub CI

# Reusable workflow: zero-configuration FlakeHub CI for small projects.
# Discovers every derivation output the flake exposes (packages, devShells,
# checks, ...), builds each system on GitHub-hosted runners, pushes everything
# to FlakeHub Cache, and publishes the flake when `visibility` is set.
#
# This is a thin, centrally-defaulted wrapper around DeterminateSystems/ci so
# that every repository picks up policy changes from one place. Use
# flakehub-build.yml when you need self-hosted runners or explicit targets.
#
# The caller must grant OIDC:
#   permissions:
#     id-token: write
#     contents: read

on:
  workflow_call:
    inputs:
      visibility:
        description: >-
          public, unlisted or private (private needs a paid FlakeHub plan).
          Empty only populates the cache.
        type: string
        default: ""
      directory:
        type: string
        default: "."
      runner-map:
        description: JSON map of Nix system to runner.
        type: string
        default: |
          {
            "x86_64-linux": "ubuntu-latest",
            "aarch64-linux": "ubuntu-24.04-arm",
            "aarch64-darwin": "macos-latest"
          }
      enable-ssh-agent:
        type: boolean
        default: false
      extra-nix-conf:
        type: string
        default: ""
    secrets:
      ssh-private-key:
        required: false
    outputs:
      flake_name:
        value: ${{ jobs.ci.outputs.flake_name }}
      flake_version:
        value: ${{ jobs.ci.outputs.flake_version }}
      flakeref_exact:
        value: ${{ jobs.ci.outputs.flakeref_exact }}

jobs:
  ci:
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      visibility: ${{ inputs.visibility }}
      directory: ${{ inputs.directory }}
      runner-map: ${{ inputs.runner-map }}
      enable-ssh-agent: ${{ inputs.enable-ssh-agent }}
      extra-nix-conf: ${{ inputs.extra-nix-conf }}
      fail-fast: false
    secrets:
      ssh-private-key: ${{ secrets.ssh-private-key }}
